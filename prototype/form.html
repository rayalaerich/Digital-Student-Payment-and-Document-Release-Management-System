<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register a payment · PSU – Goa Campus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="images/psu_logo.png" alt="Partido State University seal">
      <div>
        <small>PSU – GOA CAMPUS</small>
        <strong>Payment and Document Release</strong>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="list.html">Transactions</a>
      <a href="form.html" aria-current="page">Register payment</a>
      <a href="#">Settings ▾</a>
    </nav>
  </header>

  <main class="wrap">
    <p class="crumbs">Home › Transactions › Register payment</p>

    <section class="card form-card">
      <h2>Register a payment</h2>

      <!-- name="..." matches the column in the payment_transaction table.
           Not on this form (set by the system): TransactionID, TransactionReference,
           StudentID (from login), CashierID, CounterID, TransactionDate, TransactionStatus ('PENDING'). -->
      <form action="#" method="post" class="form">

        <label for="TermID">Academic term *</label>
        <select id="TermID" name="TermID" required>
          <option value="">Choose one</option>
          <option value="3" selected>1st Semester · 2026-2027</option>
          <option value="2">2nd Semester · 2025-2026</option>
          <option value="1">1st Semester · 2025-2026</option>
        </select>

        <fieldset class="has-error" aria-describedby="PurposeID-error">
          <legend>Payment purpose *</legend>
          <label class="radio disabled">
            <input type="radio" name="PurposeID" value="1" disabled>
            Certificate of Enrollment · ₱10.00 (already registered)
          </label>
          <label class="radio">
            <input type="radio" name="PurposeID" value="2" required>
            Student Sticker · ₱10.00
          </label>
        </fieldset>
        <p class="error" id="PurposeID-error">⚠ Please choose a payment purpose.</p>   <!-- sample error -->

        <p class="mut">Pay in cash at the Cashier after registering.</p>

        <div class="form-actions">
          <a href="list.html" class="btn btn-secondary">Cancel</a>
          <button type="submit">Register payment</button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
